[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-pipeline"
version = "1.0.0"
description = "Deterministic report pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
report-pipeline = "report_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["report_pipeline*"]
