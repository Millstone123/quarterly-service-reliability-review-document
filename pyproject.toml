[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-document"
version = "1.1.0"
description = "Deterministic service reliability review generator"
requires-python = ">=3.9"

[project.scripts]
service-review = "service_review.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["service_review*"]

[tool.setuptools.package-data]
service_review = ["py.typed"]
