[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quarterly-review-package-reader"
version = "1.0.0"
description = "Quarterly service reliability review package reader"
requires-python = ">=3.9"

[project.scripts]
review-reader = "review_reader:main"

[tool.setuptools]
packages = ["report_reviewer"]
py-modules = ["review_reader"]
