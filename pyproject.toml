[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "encoded-artifact-reader"
version = "1.0.0"
description = "Encoded document artifact reader"
requires-python = ">=3.9"

[project.scripts]
artifact-reader = "reader:main"

[tool.setuptools]
packages = ["runtime"]
py-modules = ["reader"]
