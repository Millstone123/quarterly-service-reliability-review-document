[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-reviewer"
version = "1.2.0"
description = "Deterministic renderer for structured incident-review records"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
report-reviewer = "report_reviewer.cli:main"

[tool.setuptools.packages.find]
include = ["report_reviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
