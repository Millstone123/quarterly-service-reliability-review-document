[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-reliability-report"
version = "1.0.0"
description = "Deterministic service reliability reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
service-reliability-report = "service_reliability_report.cli:main"

[tool.setuptools.packages.find]
include = ["service_reliability_report*"]
