[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quarterly-review-reader"
version = "1.0.0"
description = "Dependency-free quarterly service reliability review reader"
requires-python = ">=3.9"

[project.scripts]
review-reader = "renderer:main"

[tool.setuptools]
py-modules = ["renderer"]
packages = ["json"]
